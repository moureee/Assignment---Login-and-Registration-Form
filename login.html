<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leading University | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <img class="university-logo" src="https://images.seeklogo.com/logo-png/44/1/leading-university-logo-png_seeklogo-445048.png" alt="Leading University logo">
            <h2 class="university-name">LEADING UNIVERSITY</h2>
            <p class="motto">...A Promise to Lead</p>
            <hr>
            <h1>Welcome Back</h1>
            <p>Log in to your student account.</p>
        </div>

        <form action="#" method="POST">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" placeholder="student@lus.ac.bd" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <p class="bottom-text">New here? <a href="register.html">Create an account</a></p>
    </div>
</body>
</html>
